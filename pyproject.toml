[project]
name = "sap"
version = "0.1.0"
description = "Secure agent platform with Anthropic tool use and MCP-backed tools"
readme = "README.md"
authors = [
    { name = "Erik Seppanen", email = "esep@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "mcp[cli]>=2,<3",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
sap = "sap:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
