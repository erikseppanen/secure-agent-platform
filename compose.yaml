services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sap
      POSTGRES_USER: sap
      POSTGRES_PASSWORD: sap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap -d sap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
